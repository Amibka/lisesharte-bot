[project]
name = "lisesharte-bot"
version = "0.1.0"
description = "Telegram bot with a local language model and conversation memory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.21.0",
    "alembic>=1.16.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.2",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.24",
    "typing-extensions>=4.13.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]

[dependency-groups]
dev = ["pyrefly>=0.60.0", "ruff>=0.17.3"]
